<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Lost &amp; Found</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#101828;--muted:#556070;--line:#d3d9e3;--found:#0b7a6b;--lost:#b4390f;--accent:#2447d6}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",sans-serif;background-color:var(--bg);background-image:radial-gradient(circle at 8% -5%,rgba(123,63,228,.22),transparent 38%),radial-gradient(circle at 100% 0,rgba(232,69,139,.18),transparent 34%),radial-gradient(circle,var(--line) 1.5px,transparent 1.6px);background-size:auto,auto,22px 22px;background-attachment:fixed,fixed,scroll}
.wrap{max-width:60rem;margin:0 auto;padding:0 1.25rem 4rem}
header{position:relative;overflow:hidden;margin-top:1rem;padding:1.75rem;border-radius:1.4rem;color:#fff;background:linear-gradient(135deg,#2447d6,#7b3fe4 55%,#e8458b);box-shadow:0 6px 0 rgba(16,24,40,.25)}
h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;letter-spacing:-.03em;margin:0 0 .5rem;max-width:70%}
header p{margin:0;max-width:36rem}
.stickers{position:absolute;right:1rem;top:.9rem;display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end;max-width:11rem}
.stk{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.stk:nth-child(1){background:#ffd23f;transform:rotate(-8deg)}.stk:nth-child(2){background:#5ad6c3;transform:rotate(7deg)}.stk:nth-child(3){background:#ff9a73;transform:rotate(-4deg)}.stk:nth-child(4){background:#a7e36b;transform:rotate(9deg)}.stk:nth-child(5){background:#ffb3d1;transform:rotate(-10deg)}
.tabs{display:flex;gap:.6rem;flex-wrap:wrap;margin:1.5rem 0;border-bottom:2px solid var(--accent);padding-bottom:.75rem}
button{font:inherit;cursor:pointer}
.tab{background:var(--card);border:2px solid var(--line);color:var(--ink);padding:.6rem 1.1rem;border-radius:999px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.tab[aria-selected=true]{background:linear-gradient(135deg,#2447d6,#7b3fe4);color:#fff;border-color:transparent}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:.6rem;padding:.6rem .75rem;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.bar{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.25rem}.bar input{flex:2 1 14rem;width:auto}.bar select{flex:1 1 9rem;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr));gap:1rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:1.1rem;padding:1.1rem;display:flex;flex-direction:column;gap:.5rem;box-shadow:0 4px 0 rgba(16,24,40,.12)}
.card.found{border-left:8px solid var(--found);background:#e7f4f1}.card.lost{border-left:8px solid var(--lost);background:#fbece6}
.card img{width:100%;max-height:14rem;object-fit:cover;border-radius:.5rem}
.card h3{margin:0;font-size:1.3rem}.card p{margin:0}
.badge{align-self:flex-start;padding:.1rem .7rem;border-radius:999px;font-weight:800;font-size:.85rem;color:#fff;background:var(--accent)}
.found .badge{background:var(--found)}.lost .badge{background:var(--lost)}
.meta{color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:auto;padding-top:.5rem}
.b{border:2px solid var(--accent);background:var(--accent);color:#fff;border-radius:.6rem;padding:.5rem .9rem;font-weight:700}
.b.sec{background:none;color:var(--ink);border-color:var(--ink)}.b.danger{background:none;color:var(--lost);border-color:var(--lost)}
.claims{border-top:1px dashed var(--line);padding-top:.5rem;font-size:.9rem}
form{background:var(--card);border:2px solid var(--line);border-top:8px solid var(--accent);border-radius:.9rem;padding:1.25rem;display:grid;gap:.9rem;max-width:36rem}
form.inline{border-top-width:2px;padding:.75rem;gap:.5rem}
label{display:grid;gap:.25rem;font-weight:700}label small{font-weight:400;color:var(--muted)}
.choice{display:flex;gap:.5rem}.choice label{flex:1;display:flex;gap:.5rem;align-items:center;border:2px solid var(--line);border-radius:.6rem;padding:.6rem}.choice input{width:auto}
.note{background:var(--card);border:2px dashed var(--accent);border-radius:.9rem;padding:2rem 1.25rem;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1.2rem;border-radius:.6rem;font-weight:700}
.foot{text-align:center;color:var(--muted);margin-top:3rem;font-weight:700}
@media(max-width:40rem){.stickers{position:static;margin-top:1rem;max-width:none;justify-content:flex-start}h1{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Campus Lost &amp; Found</h1>
  <p>Found something on campus? Post it here. Lost something? Check the list or report it, and the person who has it can get in touch.</p>
  <div class="stickers" aria-hidden="true"><span class="stk">🎓</span><span class="stk">📚</span><span class="stk">🎒</span><span class="stk">✏️</span><span class="stk">💡</span></div>
</header>
<div class="tabs" role="tablist" id="tabs"></div>
<main id="main" aria-live="polite"></main>
<div class="foot">🎓 Be kind to your campus: if it isn't yours, return it.</div>
</div>
<div id="toast" class="toast" hidden></div>
<script>
// Put your Render backend link here (no slash at the end), e.g. https://campus-lost-found.onrender.com
var API_BASE="https://YOUR-APP.onrender.com";
var CATS=["Phone or electronics","Wallet, ID or cards","Keys","Bag or books","Clothing","Water bottle or lunchbox","Other"];
// Each browser gets a private id, so the site knows which posts are "yours".
var ME=localStorage.getItem("lf-id");
if(!ME){ME=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Math.random()).slice(2)+Date.now();localStorage.setItem("lf-id",ME)}
var ADMIN=sessionStorage.getItem("lf-admin")||"";
var S={view:"found",items:[],claims:[],sugg:[],q:"",cat:"",showRet:false,open:null,ret:null,del:null},last="";

function h(t,p){var e=document.createElement(t);p=p||{};for(var k in p){if(k==="text")e.textContent=p[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),p[k]);else if(k==="cls")e.className=p[k];else e.setAttribute(k,p[k])}
for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;e.appendChild(typeof c==="string"?document.createTextNode(c):c)}return e}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3500)}
function fmt(d){if(!d)return"";var x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function can(i){return !!ADMIN||i.createdBy===ME}
function err(e){toast("Could not save: "+(e.message||"try again"))}

function api(path,method,body){
  var o={method:method||"GET",headers:{}};
  if(ADMIN)o.headers["X-Admin-Key"]=ADMIN;
  if(body)o.body=new URLSearchParams(body);
  return fetch(API_BASE+"/api/"+path,o).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Request failed");return j})});
}
function load(){
  var s=Promise.resolve([]);
  if(ADMIN)s=api("suggestions").catch(function(){ADMIN="";sessionStorage.removeItem("lf-admin");return[]});
  Promise.all([api("items?by="+ME),api("claims?by="+ME),s]).then(function(r){
    var sig=JSON.stringify(r);if(sig===last)return;last=sig;S.items=r[0];S.claims=r[1];S.sugg=r[2];render();
  }).catch(function(){});
}

function renderTabs(){var t=document.getElementById("tabs");t.textContent="";
[["found","🔎 Found items"],["lost","🙋 Lost reports"],["post","➕ Post an item"],["mine","📌 Posted by you"],["sug","💡 Suggestion box"]].forEach(function(v){
  var n=(v[0]==="found"||v[0]==="lost")?" ("+S.items.filter(function(i){return i.type===v[0]&&i.status!=="returned"}).length+")":"";
  t.appendChild(h("button",{cls:"tab",role:"tab","aria-selected":String(S.view===v[0]),text:v[1]+n,onclick:function(){S.view=v[0];S.open=S.ret=S.del=null;render()}}))})}

function render(){renderTabs();var m=document.getElementById("main");m.textContent="";
  if(S.view==="sug"){m.appendChild(sugForm());m.appendChild(sugInbox());return}
  if(S.view==="post"){m.appendChild(postForm());return}
  var type=S.view,list;
  function redraw(){var n=listEl(type);list.replaceWith(n);list=n}
  var sel=h("select",{"aria-label":"Category",onchange:function(e){S.cat=e.target.value;redraw()}},h("option",{value:"",text:"All categories"}));
  CATS.forEach(function(c){var o=h("option",{value:c,text:c});if(c===S.cat)o.selected=true;sel.appendChild(o)});
  var chk=h("input",{type:"checkbox",style:"width:auto",onchange:function(e){S.showRet=e.target.checked;redraw()}});chk.checked=S.showRet;
  var bar=h("div",{cls:"bar"},h("input",{type:"search","aria-label":"Search items",placeholder:"Search by item, place or detail",value:S.q,oninput:function(e){S.q=e.target.value;redraw()}}),sel,
    h("label",{style:"display:flex;flex-direction:row;align-items:center;gap:.4rem;font-weight:500"},chk,"Show returned"));
  list=listEl(type);m.appendChild(bar);m.appendChild(list)}

function listEl(type){var q=S.q.toLowerCase();
  var rows=S.items.filter(function(i){return(type==="mine"?i.createdBy===ME:i.type===type)&&(S.showRet||type==="mine"||i.status!=="returned")&&(!S.cat||i.category===S.cat)&&(!q||[i.title,i.place,i.description,i.category].join(" ").toLowerCase().indexOf(q)>-1)});
  if(!rows.length)return h("div",{cls:"note",text:type==="mine"?"You haven't posted anything yet. Use Post an item to add one.":type==="found"?"No found items match. If you found something, use Post an item so its owner can claim it.":"No lost reports match. If you lost something, use Post an item."});
  var g=h("div",{cls:"grid"});rows.forEach(function(i){g.appendChild(card(i))});return g}

function card(i){var mine=can(i),cl=S.claims.filter(function(c){return c.itemId===i.id});
  var c=h("article",{cls:"card "+i.type},
    i.photo&&h("img",{src:i.photo,alt:"Photo of "+i.title,loading:"lazy"}),
    h("span",{cls:"badge",text:(i.type==="found"?"Found":"Lost")+(i.status==="returned"?" · returned":"")}),
    h("h3",{text:i.title}),
    h("div",{cls:"meta",text:[i.category,i.place,fmt(i.date)].filter(Boolean).join(" · ")}),
    i.description&&h("p",{text:i.description}),
    i.status==="returned"&&h("div",{cls:"meta",text:(i.type==="found"?"Handed over to ":"Returned by ")+(i.returnedTo||"someone")+(i.returnedId?" ("+i.returnedId+")":"")+(i.returnedAt?" on "+fmt(i.returnedAt):"")}),
    h("div",{cls:"meta",text:"Posted by "+(i.name||"a student")+(cl.length?" · "+cl.length+(i.type==="found"?(cl.length>1?" claims":" claim"):(cl.length>1?" replies":" reply")):"")}));
  if(mine&&i.contact)c.appendChild(h("div",{cls:"meta",text:"Your contact: "+i.contact}));
  if(mine&&cl.length){var b=h("div",{cls:"claims"},h("strong",{text:i.type==="found"?"People who say this is theirs:":"People who may have found it:"}));
    cl.forEach(function(x){b.appendChild(h("div",{text:x.name+" ("+(x.contact||"")+")"+(x.message?": "+x.message:"")}))});c.appendChild(b)}
  var a=h("div",{cls:"actions"});
  if(i.status!=="returned")a.appendChild(h("button",{cls:"b",text:i.type==="found"?"This is mine":"I found this",onclick:function(){S.open=S.open===i.id?null:i.id;S.ret=null;render()}}));
  if(mine&&i.status!=="returned")a.appendChild(h("button",{cls:"b sec",text:"Mark as returned",onclick:function(){S.ret=S.ret===i.id?null:i.id;S.open=null;S.del=null;render()}}));
  if(mine){if(S.del===i.id){
    a.appendChild(h("button",{cls:"b danger",text:"Yes, delete",onclick:function(){S.del=null;api("items/"+i.id+"?by="+ME,"DELETE").then(function(){toast("Deleted");last="";load()}).catch(err)}}));
    a.appendChild(h("button",{cls:"b sec",text:"Cancel",onclick:function(){S.del=null;render()}}));
  }else a.appendChild(h("button",{cls:"b danger",text:"Delete",onclick:function(){S.del=i.id;render()}}))}
  c.appendChild(a);
  if(S.open===i.id)c.appendChild(claimForm(i));
  if(S.ret===i.id)c.appendChild(returnForm(i));
  return c}

function claimForm(i){var fd=i.type==="found";
  var f=h("form",{cls:"inline"},
    h("label",{},"Your name",h("input",{name:"name",required:"",maxlength:"80"})),
    h("label",{},"Phone or email",h("input",{name:"contact",required:"",maxlength:"120"})),
    h("label",{},fd?"Describe something only the owner would know":"Where did you find it?",h("textarea",{name:"message",rows:"2",required:"",maxlength:"400"})),
    h("button",{cls:"b",type:"submit",text:fd?"Send claim to finder":"Send message to owner"}));
  f.addEventListener("submit",function(e){e.preventDefault();var d=new FormData(f);
    api("claims","POST",{itemId:i.id,name:d.get("name").trim(),contact:d.get("contact").trim(),message:d.get("message").trim(),createdBy:ME})
    .then(function(){S.open=null;toast("Sent. "+(i.name||"The poster")+" will contact you.");last="";load()}).catch(err)});
  return f}

function returnForm(i){var fd=i.type==="found";
  var f=h("form",{cls:"inline"},
    h("label",{},fd?"Who did you hand it to?":"Who returned it to you?",h("input",{name:"to",required:"",maxlength:"80"})),
    h("label",{},"Their roll number, ID or phone",h("input",{name:"pid",required:"",maxlength:"60"})),
    h("label",{style:"display:flex;flex-direction:row;gap:.5rem;font-weight:500"},h("input",{type:"checkbox",required:"",style:"width:auto"}),fd?"I confirm I handed this over in person.":"I confirm I received my item back."),
    h("button",{cls:"b",type:"submit",text:"Confirm and mark as returned"}));
  f.addEventListener("submit",function(e){e.preventDefault();var d=new FormData(f);
    api("items/"+i.id+"/return?by="+ME,"POST",{to:d.get("to").trim(),pid:d.get("pid").trim()}).then(function(){S.ret=null;toast("Marked as returned");last="";load()}).catch(err)});
  return f}

// Shrink the photo in the browser before sending it to the Java server.
function shrink(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();
  im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.8))};
  im.onerror=function(){rej(new Error("Could not read the photo"))};im.src=u})}

function postForm(){
  var cat=h("select",{name:"category"});CATS.forEach(function(c){cat.appendChild(h("option",{value:c,text:c}))});
  var f=h("form",{},
    h("div",{cls:"choice"},h("label",{},h("input",{type:"radio",name:"type",value:"found",checked:""}),"I found something"),h("label",{},h("input",{type:"radio",name:"type",value:"lost"}),"I lost something")),
    h("label",{},"Photo (optional)",h("input",{type:"file",name:"photo",accept:"image/*"})),
    h("label",{},"Item",h("input",{name:"title",required:"",maxlength:"80",placeholder:"Black Casio calculator"})),
    h("label",{},"Category",cat),
    h("label",{},"Place",h("input",{name:"place",required:"",maxlength:"100",placeholder:"Library, 2nd floor"})),
    h("label",{},"Date",h("input",{name:"date",type:"date",required:"",value:new Date().toISOString().slice(0,10)})),
    h("label",{},"Details",h("small",{text:"For found items, leave out one detail so the real owner can prove it."}),h("textarea",{name:"description",rows:"3",maxlength:"400"})),
    h("label",{},"Your name",h("input",{name:"name",required:"",maxlength:"80"})),
    h("label",{},"Phone or email",h("small",{text:"Only you can see this."}),h("input",{name:"contact",required:"",maxlength:"120"})),
    h("button",{cls:"b",type:"submit",text:"Post item"}));
  f.addEventListener("submit",function(e){e.preventDefault();var d=new FormData(f),o={},file=d.get("photo"),btn=f.querySelector("button[type=submit]");
    d.forEach(function(v,k){if(typeof v==="string")o[k]=v.trim()});o.createdBy=ME;btn.disabled=true;btn.textContent="Posting…";
    var go=(file&&file.size)?shrink(file).then(function(u){o.photo=u}):Promise.resolve();
    go.then(function(){return api("items","POST",o)}).then(function(){toast("Posted");S.view=o.type;last="";load();render()})
      .catch(function(e){btn.disabled=false;btn.textContent="Post item";err(e)})});
  return f}

function sugForm(){
  var k=h("select",{name:"kind"});["New feature","Something is not working","Other idea"].forEach(function(x){k.appendChild(h("option",{value:x,text:x}))});
  var f=h("form",{},
    h("label",{},"What would you like to share?",h("small",{text:"Ideas for new options, problems you noticed, or anything that would improve this portal. Only the website host can read it."}),h("textarea",{name:"text",rows:"5",required:"",maxlength:"1000"})),
    h("label",{},"Type",k),
    h("label",{},"Your name (optional)",h("input",{name:"name",maxlength:"80"})),
    h("button",{cls:"b",type:"submit",text:"Send to the host"}));
  f.addEventListener("submit",function(e){e.preventDefault();var d=new FormData(f);
    api("suggestions","POST",{text:d.get("text").trim(),kind:d.get("kind"),name:d.get("name").trim(),createdBy:ME}).then(function(){f.reset();toast("Sent. Thank you!")}).catch(err)});
  return f}

function sugInbox(){
  var w=h("div",{style:"margin-top:2rem"});
  if(!ADMIN){
    var pw=h("input",{type:"password",placeholder:"Host password","aria-label":"Host password",style:"max-width:14rem"});
    w.appendChild(h("div",{style:"display:flex;gap:.5rem;flex-wrap:wrap"},pw,h("button",{cls:"b sec",text:"Host login",onclick:function(){ADMIN=pw.value;sessionStorage.setItem("lf-admin",ADMIN);last="";load();setTimeout(function(){if(!ADMIN)toast("Wrong password")},800)}})));
    return w}
  w.appendChild(h("h2",{text:"Inbox (only the host can see this)",style:"font-size:1.4rem;margin:0 0 1rem"}));
  if(!S.sugg.length){w.appendChild(h("div",{cls:"note",text:"No suggestions yet."}));return w}
  var g=h("div",{cls:"grid"});S.sugg.forEach(function(x){g.appendChild(h("article",{cls:"card"},h("span",{cls:"badge",text:x.kind||"Idea"}),h("p",{text:x.text}),h("div",{cls:"meta",text:(x.name||"Anonymous")+" · "+new Date(+x.createdAt).toLocaleDateString()})))});
  w.appendChild(g);return w}

render();load();
setInterval(load,3000); // checks for new posts every 3 seconds, so everyone sees updates live
</script>
</body>
</html>
